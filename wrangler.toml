name = "k-vault"
pages_build_output_dir = "."
compatibility_date = "2026-05-03"

# Git 集成部署:绑定图片元数据 KV(namespace 已存在,勿删)
# 2026-11-01 已切换为 Git 集成,push 到 main 自动部署
[[kv_namespaces]]
binding = "img_url"
id = "3168e827d4d94a019d3887d914b7f8fd"

[vars]
# 频道 ID 与反代地址;反代 Worker 已启用 BOT_ID_ALLOWLIST 白名单,
# 仅放行本项目的 bot,因此该地址含密钥前缀也可随公开仓库分发
TG_Chat_ID = "-1004442931304"
CUSTOM_BOT_API_URL = "https://kvault-tg-proxy.2702577921.workers.dev/kvpx_7f3a9c2e51b84d06af1e"
BASIC_USER = "admin"

# 注意:Secrets(TG_Bot_Token / BASIC_PASS)不写入本文件,
# 在 Cloudflare 后台或 wrangler pages secret put 配置,密钥不会进仓库。
